version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fall-detection-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - ALLOWED_ORIGINS=http://localhost:5173,https://your-frontend.vercel.app
      - WS_MAX_FPS=15
      - FRAME_RATE_LIMIT=30
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/artifacts:/app/artifacts
      - ../urfd_fall_yolo_pose:/app/core_ai:ro
    restart: unless-stopped
    networks:
      - fall-detection-network

networks:
  fall-detection-network:
    driver: bridge
