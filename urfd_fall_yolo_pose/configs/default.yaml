# =========================================================
# Fall Detection Configuration
# Hypothesis→Verification Dual-Tier Architecture
# =========================================================

# Detection Mode
# - 'demo': Early decision for short clips (~0.2-0.5s trigger)
# - 'realtime': Full verification with confirmation buffer (~0.5-2s)
detection_mode: 'realtime'
fps: 30 # Video FPS for time-based normalization

# =========================================================
# YOLOv8 Pose Model Configuration
# =========================================================
yolo_model: 'yolov8s-pose.pt'
imgsz: 640
conf_thres: 0.25
iou_thres: 0.45
keypoint_conf_thres: 0.5

# Low-light preprocessing
preprocess_lowlight: true
gamma: 1.3
clahe_clip: 2.0
clahe_grid: 8

# =========================================================
# Tracking Configuration
# =========================================================
# Primary Person Tracking
track_iou_thres: 0.3
track_center_dist_thres: 1.5
track_max_missing: 8

# Fallback tracking
fallback_track_max_gap: 6
fallback_tracker_type: 'kcf'

# =========================================================
# Hypothesis Trigger (Tier 1)
# Fast detection for short clips
# =========================================================
hypothesis:
  early_score_thres: 0.30 # Minimum score to enter HYPOTHESIS state
  early_score_high: 0.65 # High confidence for immediate FALL (demo mode)
  early_frames: 3 # Max frames for early decision (~0.1s at 30fps)

# =========================================================
# Verification (Tier 2 - realtime mode)
# Confirmation buffer for false positive reduction
# =========================================================
verification:
  hypothesis_threshold: 0.35 # Balanced threshold
  verify_score_thres: 0.45 # Confirmation threshold (balanced precision/recall)
  confirm_frames: 8 # Frames to hold state before alert
  confirm_window: 20 # Window size for confirmation check
  min_confirm_duration_frames: 1 # Min frames above threshold
  post_motion_thres: 3.5 # Motion settling threshold

  # Velocity Gating (Anti-Slow-Lying)
  enable_velocity_gate: false # Disabled to improve recall on slow falls
  min_fall_velocity: 0.05 # Minimum velocity if enabled

# =========================================================
# Feature Thresholds (normalized values)
# =========================================================
thresholds:
  height_drop_norm: 0.15 # 15% height reduction triggers
  width_increase: 0.25 # 25% width increase indicates lying
  dy_norm_peak: 0.08 # 8% of baseline_h per frame
  dy_acc_thres: 0.03 # Acceleration threshold
  dH_thres: 0.05 # Frame-to-frame height change
  dW_thres: 0.05 # Frame-to-frame width change

# =========================================================
# Feature Scoring Weights
# =========================================================
weights:
  hw_ratio: 5.0 # Lying posture indicator (width/height)
  height_ratio: -10.0 # Height reduction penalty
  floor_distance: 4.0 # Proximity to floor
  variance_boost: 3.0 # Motion indicator
  border_penalty: -3.0 # Edge detection penalty
  upward_penalty: -10.0 # Standing up motion penalty
  downward_boost: 2.0 # Falling motion boost
  intercept: -9.0 # Baseline offset

# Variance and quality thresholds
variance_window: 10 # Frames for position variance
variance_threshold: 10.0 # High variance = movement

# =========================================================
# Baseline Computation
# =========================================================
baseline_window: 30 # Frames for stable baseline (~1s at 30fps)
stable_motion_thres: 2.0 # dy below this = stable frame

# =========================================================
# Temporal Smoothing
# =========================================================
cand_enter_frames: 2
confirm_frames: 3
confirm_window: 14
height_window: 16

# Missing detection
max_missing_streak: 5

# =========================================================
# Recovery Detection
# =========================================================
recovery_window: 13
recovery_upright_angle_thres: 48.0
recovery_ar_thres: 1.12

# =========================================================
# Score Parameters
# =========================================================
score_decay: 0.85
min_confirm_duration_frames: 1

# =========================================================
# Output Settings
# =========================================================
output_fps: 25
output_dir: 'outputs'

# Debug mode - adds extra visualization
debug_overlay: true

# =========================================================
# Reproducibility
# =========================================================
seed: 42
