# YOLOv8 Pose Model Configuration
yolo_model: 'yolov8s-pose.pt'
imgsz: 640
conf_thres: 0.25
iou_thres: 0.45
keypoint_conf_thres: 0.5

# Low-light preprocessing
preprocess_lowlight: true
gamma: 1.3
clahe_clip: 2.0
clahe_grid: 8

# Primary Person Tracking
track_iou_thres: 0.3
track_center_dist_thres: 1.5
track_max_missing: 8

# Fallback tracking
fallback_track_max_gap: 6
fallback_tracker_type: 'kcf'

# Fall Detection Rule Thresholds
angle_thres: 55.0
ar_thres: 1.15
confirm_angle_thres: 48.0
confirm_ar_thres: 1.35
height_drop_thres: 0.18
height_drop_thres_strong: 0.28

# Dynamic Fall Detection
dy_fall_thres: 10.0
dy_window: 5
dy_short_window: 3
dy_long_window: 10
dy_peak_thres: 8.0

# Border integrity check
border_margin: 8

# Impact verification for static posture path (raised to reduce false positives from normal lying)
impact_dy_thres: 10.0

# High-angle threshold (very horizontal posture indicator)
high_angle_thres: 65.0

# Minimum dy_peak required for high-angle path (distinguish from controlled lying)
high_angle_dy_peak_thres: 8.0

# Minimum dy_peak to trigger CANDIDATE for PATH 2 & 3 (prevent normal lying)
# Normal controlled lying: dy_peak typically 3-10
# Actual falls: dy_peak typically > 15-20
min_candidate_dy_peak: 12.0

# Height Drop Analysis
height_drop_short_window: 5

# Temporal Smoothing Parameters
cand_enter_frames: 2
cand_tolerance: 1
confirm_frames: 3
confirm_tolerance: 2
confirm_window: 10
height_window: 12

# Missing Detection Handling
max_missing_streak: 5

# Recovery Detection
recovery_window: 10
recovery_upright_angle_thres: 55.0
recovery_ar_thres: 1.25
recovery_height_recover_ratio: 0.70

# Motion Settling
motion_settle_window: 8
settle_dy_abs_thres: 10.0

# Slow Transition Gate (controlled lying down detection)
# If max dy_peak in short window is below this threshold, it's considered slow transition
# Actual falls typically have dy_peak > 20-30, controlled lying usually < 15
slow_lie_max_dy_peak: 15.0

# Minimum dy_peak ever observed to confirm a fall (prevents false positives from normal lying)
# This is the CRITICAL threshold that distinguishes falls from controlled lying
# Real falls have rapid uncontrolled descent with dy_peak typically > 18-25
# Normal lying down has controlled descent with dy_peak typically < 12-15
min_dy_peak_for_fall: 18.0

# Score Parameters
score_decay: 0.85
score_boost_candidate: 0.05
score_boost_confirmed: 1.0

# Minimum consecutive FALL_CONFIRMED frames
min_confirm_duration_frames: 2

# Output Settings
output_fps: 25
output_dir: 'outputs'

# Reproducibility
seed: 42
