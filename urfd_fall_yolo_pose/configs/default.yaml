# YOLOv8 Pose Model Configuration
yolo_model: 'yolov8s-pose.pt'
imgsz: 640
conf_thres: 0.25
iou_thres: 0.45
keypoint_conf_thres: 0.5

# Low-light preprocessing
preprocess_lowlight: true
gamma: 1.3
clahe_clip: 2.0
clahe_grid: 8

# Primary Person Tracking
track_iou_thres: 0.3
track_center_dist_thres: 1.5
track_max_missing: 8

# Fallback tracking
fallback_track_max_gap: 6
fallback_tracker_type: 'kcf'

# Fall Detection Rule Thresholds
angle_thres: 55.0
ar_thres: 1.15
confirm_angle_thres: 48.0
confirm_ar_thres: 1.35
height_drop_thres: 0.18
height_drop_thres_strong: 0.28

# Dynamic Fall Detection
dy_fall_thres: 10.0
dy_window: 5
dy_short_window: 3
dy_long_window: 10
dy_peak_thres: 6.0 # BALANCED for 28/30 falls

# Border integrity check
border_margin: 8

# Impact verification for static posture path (lowered for better recall)
impact_dy_thres: 3.5 # BALANCED for 28/30 falls

# High-angle threshold (new: very horizontal = likely fall)
high_angle_thres: 65.0

# Height Drop Analysis
height_drop_short_window: 5

# Temporal Smoothing Parameters
cand_enter_frames: 2
cand_tolerance: 1
confirm_frames: 2 # BALANCED: 1→2 for better precision
confirm_tolerance: 2
confirm_window: 10
height_window: 12

# Missing Detection Handling
max_missing_streak: 5

# Recovery Detection
recovery_window: 15 # INCREASED: 10→15 to prevent premature reset
recovery_upright_angle_thres: 55.0
recovery_ar_thres: 1.25
recovery_height_recover_ratio: 0.75 # INCREASED: 0.70→0.75 (more strict)

# Motion Settling
motion_settle_window: 8
settle_dy_abs_thres: 10.0

# Slow Transition Gate
slow_lie_max_dy_peak: 18.0

# Score Parameters
score_decay: 0.85
score_boost_candidate: 0.05
score_boost_confirmed: 1.0

# Minimum consecutive FALL_CONFIRMED frames
min_confirm_duration_frames: 2

# Output Settings
output_fps: 25
output_dir: 'outputs'

# Reproducibility
seed: 42
